[project]
name = "nepali-plagiarism-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "fastapi>=0.135.3",
    "jwt>=1.4.0",
    "loguru>=0.7.3",
    "pypdf>=4.0.0",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "python-multipart>=0.0.26",
    "redis>=5.0.0",
    "reportlab>=4.4.10",
    "scikit-learn>=1.8.0",
    "snowballstemmer>=2.2.0",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
